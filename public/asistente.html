<!DOCTYPE html>
<!--
    asistente.html
    --------------
    NOVA: asistente de IA por voz con interfaz tipo HUD (pantalla de
    ciencia ficción). Toda la lógica está en /js/asistente.js.

    Tecnologías del navegador que usamos (no hace falta instalar nada):
      - Web Speech API → SpeechRecognition: convierte tu voz en texto
      - Web Speech API → speechSynthesis:   convierte texto en voz
      - Canvas 2D:                          dibuja el núcleo animado
      - fetch + ReadableStream:             recibe la respuesta a trozos
      - FileReader:                         lee los archivos que adjuntas
    Y dos librerías (instaladas con npm, servidas desde /vendor):
      - marked:    convierte el Markdown de las respuestas en HTML
      - DOMPurify: limpia ese HTML para que no pueda colarse código malicioso
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA | Asistente de IA</title>
    <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
    <meta name="description" content="NOVA, asistente de inteligencia artificial por voz creado por Santiago Lafuente con Node.js y la API de Claude.">
    <style>
        /* ── Variables de color (tokens) ───────────────────────────
           Cambiando estas líneas cambias el aspecto de toda la página. */
        :root {
            --fondo: #03070d;
            --panel: rgba(8, 24, 38, 0.72);
            --panel-2: rgba(4, 14, 24, 0.9);
            --linea: rgba(79, 209, 255, 0.22);
            --acento: #4fd1ff;
            --acento-2: #ffb547;   /* color cuando NOVA está pensando */
            --texto: #d7f3ff;
            --tenue: #7d9db0;
            --error: #ff6b6b;
            --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background:
                radial-gradient(ellipse at 50% 15%, rgba(79, 209, 255, 0.10), transparent 55%),
                var(--fondo);
            color: var(--texto);
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Rejilla de fondo sutil, como una pantalla de laboratorio */
        body::before {
            content: "";
            position: fixed; inset: 0;
            background-image:
                linear-gradient(var(--linea) 1px, transparent 1px),
                linear-gradient(90deg, var(--linea) 1px, transparent 1px);
            background-size: 48px 48px;
            opacity: 0.18;
            pointer-events: none;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
        }

        /* ── Cabecera ─────────────────────────────────────────────── */
        header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px clamp(16px, 4vw, 40px);
            font-family: var(--mono);
            font-size: 0.8rem; letter-spacing: 0.12em; color: var(--tenue);
            position: relative; z-index: 1;
        }
        header a { color: var(--tenue); text-decoration: none; }
        header a:hover { color: var(--acento); }
        .marca { color: var(--acento); font-weight: 700; letter-spacing: 0.3em; }

        main {
            flex: 1;
            width: 100%; max-width: 960px;
            margin: 0 auto;
            padding: 0 16px 16px;
            display: flex; flex-direction: column; align-items: center;
            gap: 10px;
            position: relative; z-index: 1;
        }

        /* ── Núcleo animado ───────────────────────────────────────── */
        .nucleo {
            position: relative;
            width: min(230px, 56vw);
            aspect-ratio: 1;
            border: none; background: none; cursor: pointer;
            border-radius: 50%;
            -webkit-tap-highlight-color: transparent;
            flex-shrink: 0;
        }
        .nucleo canvas { width: 100%; height: 100%; display: block; }
        .nucleo:focus-visible { outline: 2px solid var(--acento); outline-offset: 6px; }

        #estado {
            font-family: var(--mono);
            font-size: 0.8rem; letter-spacing: 0.2em; text-transform: uppercase;
            color: var(--acento); min-height: 1.2em; text-align: center;
            max-width: 100%; overflow-wrap: anywhere;
        }
        #estado.pensando { color: var(--acento-2); letter-spacing: 0.08em; }
        #estado.error { color: var(--error); letter-spacing: 0.05em; text-transform: none; }

        .ayuda { color: var(--tenue); font-size: 0.85rem; text-align: center; }
        kbd {
            border: 1px solid var(--linea); border-radius: 4px;
            padding: 1px 6px; font-family: inherit; font-size: 0.8em;
        }

        /* ── Conversación ─────────────────────────────────────────── */
        #conversacion {
            width: 100%;
            flex: 1;
            min-height: 220px; max-height: 58vh;
            overflow-y: auto;
            padding: 16px;
            background: var(--panel);
            border: 1px solid var(--linea);
            border-radius: 12px;
            backdrop-filter: blur(6px);
            display: flex; flex-direction: column; gap: 16px;
        }
        .msg { max-width: 92%; line-height: 1.55; font-size: 0.97rem; overflow-wrap: anywhere; }
        .msg .quien {
            display: block;
            font-family: var(--mono);
            font-size: 0.7rem; letter-spacing: 0.2em; color: var(--tenue);
            margin-bottom: 4px;
        }
        .msg.user { align-self: flex-end; text-align: right; white-space: pre-wrap; }
        .msg.assistant { align-self: flex-start; width: 92%; }
        .msg.assistant .quien { color: var(--acento); }
        .vacio { color: var(--tenue); text-align: center; margin: auto; font-size: 0.9rem; line-height: 1.7; }

        /* Etiquetas de archivos adjuntos (en mensajes y en la barra) */
        .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; margin-bottom: 4px; }
        .chip {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 0.78rem; padding: 3px 8px;
            border: 1px solid var(--linea); border-radius: 999px;
            color: var(--tenue); background: var(--panel-2);
            max-width: 220px;
        }
        .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .chip button { background: none; border: none; color: var(--tenue); cursor: pointer; font-size: 0.9rem; }
        .chip button:hover { color: var(--error); }
        #pendientes { width: 100%; justify-content: flex-start; }
        #pendientes:empty { display: none; }

        /* Razonamiento (desplegable) */
        details.razonamiento {
            margin-bottom: 8px;
            border-left: 2px solid var(--acento-2);
            padding-left: 10px;
            font-size: 0.85rem; color: var(--tenue);
        }
        details.razonamiento summary { cursor: pointer; color: var(--acento-2); font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.1em; }
        details.razonamiento div { white-space: pre-wrap; margin-top: 6px; max-height: 240px; overflow-y: auto; }

        /* Estilos del Markdown de las respuestas */
        .md > * + * { margin-top: 0.7em; }
        .md h1, .md h2, .md h3, .md h4 { color: var(--acento); line-height: 1.3; font-size: 1.05rem; }
        .md h1 { font-size: 1.2rem; } .md h2 { font-size: 1.12rem; }
        .md ul, .md ol { padding-left: 1.4em; }
        .md li + li { margin-top: 0.25em; }
        .md a { color: var(--acento); }
        .md strong { color: #fff; }
        .md code { font-family: var(--mono); font-size: 0.88em; background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
        .md pre { background: var(--panel-2); border: 1px solid var(--linea); border-radius: 8px; padding: 12px; overflow-x: auto; }
        .md pre code { background: none; padding: 0; }
        .md table { border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%; }
        .md th, .md td { border: 1px solid var(--linea); padding: 6px 10px; text-align: left; vertical-align: top; }
        .md th { color: var(--acento); background: var(--panel-2); }
        .md blockquote { border-left: 3px solid var(--linea); padding-left: 10px; color: var(--tenue); }
        .md hr { border: none; border-top: 1px solid var(--linea); }

        .fuentes { margin-top: 10px; font-size: 0.8rem; color: var(--tenue); }
        .fuentes ol { padding-left: 1.4em; margin-top: 4px; }
        .fuentes a { color: var(--tenue); }
        .fuentes a:hover { color: var(--acento); }

        /* ── Barra para escribir ──────────────────────────────────── */
        form {
            width: 100%;
            display: flex; gap: 8px; align-items: flex-end;
        }
        textarea {
            flex: 1; min-width: 0;
            padding: 12px 14px;
            background: var(--panel);
            color: var(--texto);
            border: 1px solid var(--linea);
            border-radius: 10px;
            font: inherit; font-size: 1rem;
            resize: none;
            max-height: 180px;
        }
        textarea:focus { outline: none; border-color: var(--acento); }
        .boton {
            height: 48px;
            padding: 0 14px;
            background: transparent;
            color: var(--acento);
            border: 1px solid var(--acento);
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            white-space: nowrap;
        }
        .boton:hover { background: rgba(79, 209, 255, 0.12); }
        .boton.secundario { border-color: var(--linea); }
        .boton[aria-pressed="true"] { color: var(--tenue); }
        @media (max-width: 480px) {
            .boton { padding: 0 10px; }
            #enviar-texto { display: none; }
        }

        /* Aviso al arrastrar archivos sobre la página */
        body.arrastrando main::after {
            content: "Suelta aquí tus archivos";
            position: fixed; inset: 0;
            display: grid; place-items: center;
            background: rgba(3, 7, 13, 0.85);
            border: 2px dashed var(--acento);
            color: var(--acento); font-family: var(--mono); letter-spacing: 0.2em;
            z-index: 10;
        }

        .oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    </style>
</head>
<body>
    <header>
        <span class="marca">N·O·V·A</span>
        <a href="/">← Volver al portafolio</a>
    </header>

    <main>
        <!-- El núcleo es un botón: así funciona con teclado y lectores de pantalla -->
        <button class="nucleo" id="nucleo" type="button" aria-label="Pulsa para hablar con NOVA">
            <canvas id="lienzo"></canvas>
        </button>

        <p id="estado" role="status" aria-live="polite">En espera</p>
        <p class="ayuda" id="ayuda">Pulsa el núcleo o <kbd>Espacio</kbd> para hablar · Adjunta fotos, PDFs, código o datos</p>

        <section id="conversacion" aria-label="Conversación">
            <p class="vacio">
                Prueba a pedirle:<br>
                «¿A cuánto cotizan hoy XRP y HBAR?»<br>
                «Analiza este PDF y hazme un resumen» (adjúntalo con 📎)<br>
                «Explícame qué es una API REST con un ejemplo en Node.js»
            </p>
        </section>

        <div class="chips" id="pendientes" aria-label="Archivos adjuntos"></div>

        <form id="formulario" autocomplete="off">
            <input type="file" id="archivo" class="oculto" multiple
                   accept="image/png,image/jpeg,image/gif,image/webp,application/pdf,.txt,.md,.csv,.json,.js,.ts,.java,.kt,.py,.html,.css,.sql,.xml,.log,.yml,.yaml">
            <button class="boton secundario" type="button" id="adjuntar" title="Adjuntar archivos" aria-label="Adjuntar archivos">📎</button>
            <textarea id="entrada" rows="1" placeholder="Escribe o dicta una tarea… (Mayús+Intro = nueva línea)" aria-label="Mensaje para NOVA"></textarea>
            <button class="boton" type="submit" aria-label="Enviar"><span id="enviar-texto">Enviar</span><span aria-hidden="true"> ➤</span></button>
            <button class="boton secundario" type="button" id="silencio" aria-pressed="false" title="Activar o silenciar la voz" aria-label="Silenciar voz">🔊</button>
        </form>
    </main>

    <script src="/vendor/marked.js"></script>
    <script src="/vendor/purify.js"></script>
    <script src="/js/asistente.js"></script>
</body>
</html>
